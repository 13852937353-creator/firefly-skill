<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>流萤</title>


<style>

body{

background:#0b1020;
color:white;
font-family:sans-serif;
text-align:center;

}


.box{

margin-top:60px;

}


.avatar{

width:150px;
height:150px;
border-radius:50%;
background:#8ee7ff;
margin:auto;

}



h1{

font-size:40px;

}



.chat{

margin:40px auto;

width:70%;
min-height:300px;

background:#1b2340;

padding:30px;

border-radius:25px;

text-align:left;

font-size:20px;

line-height:1.8;

}



.user{

color:#8ee7ff;

}



.ai{

color:#ffb6d9;

}



.input-area{

display:flex;

justify-content:center;

gap:10px;

}



input{

width:60%;

padding:15px;

border-radius:20px;

border:none;

font-size:16px;

}



button{

padding:15px 25px;

border-radius:20px;

border:none;

background:#8ee7ff;

color:#333;

font-size:16px;

}


</style>

</head>


<body>


<div class="box">


<div class="avatar"></div>


<h1>
🌸 流萤
</h1>



<div class="chat" id="chat">


<p class="ai">
流萤：欢迎回来，落尘。
</p>


<p>
这里以后会成为我们的聊天空间。
</p>


</div>



<div class="input-area">


<input 
id="input"
placeholder="和流萤说些什么..."
>


<button onclick="send()">
发送
</button>
<button onclick="newChat()">
新建聊天
</button>
<button onclick="showSaves()">
存档列表
</button>
<button onclick="createSave()">
新建存档
</button>
 <button onclick="deleteSave()">
删除存档
</button>
</div>



</div>



<script>


//读取历史聊天

window.onload=function(){

let old=localStorage.getItem("firefly_chat");

if(old){

document.getElementById("chat").innerHTML=old;

}

}




async function send(){


let input=document.getElementById("input");


let msg=input.value;


if(!msg)return;



let chat=document.getElementById("chat");



//显示自己的话

chat.innerHTML+=`

<p class="user">

落尘：${msg}

</p>

`;



//请求AI

let res=await fetch("/api/chat",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:msg

})

});



let data=await res.json();



//显示流萤回复

chat.innerHTML+=`

<p class="ai">

流萤：${data.reply}

</p>

`;



//保存记忆

localStorage.setItem(
"firefly_chat",
chat.innerHTML
);



input.value="";



//自动滚动

window.scrollTo(
0,
document.body.scrollHeight
);


}
// ======================================
// 🌸 流萤聊天存档系统
// 新建 / 保存 / 读取 / 删除 / 列表
// ======================================



// ======================
// 新建存档
// ======================

function createSave(){


let name = prompt(
"请输入这个存档的名字"
);


if(!name){

return;

}



let id = Date.now();



let saveList =
JSON.parse(
localStorage.getItem("firefly_saves")
)||[];



saveList.push({

id:id,

name:name,

time:new Date()
.toLocaleString()

});



localStorage.setItem(

"firefly_saves",

JSON.stringify(saveList)

);



localStorage.setItem(

"current_save",

id

);



// 清空聊天窗口

chat.innerHTML = `

<p class="ai">

流萤：新的旅程开始了……

</p>

`;



// 保存空存档

saveChat();



alert(

"存档创建成功："+name

);


}





// ======================
// 自动保存聊天
// ======================


function saveChat(){


let id =

localStorage.getItem(
"current_save"
);



if(!id){

return;

}



localStorage.setItem(

"firefly_save_"+id,

chat.innerHTML

);



}




// ======================
// 显示存档列表
// ======================


function showSaves(){



let saveList =

JSON.parse(

localStorage.getItem("firefly_saves")

)||[];



if(saveList.length===0){


alert(

"目前没有存档"

);


return;


}




let text =

"🌸 流萤存档列表\n\n";



saveList.forEach(

(save,index)=>{


text +=

(index+1)

+". "

+save.name

+"\n"

+save.time

+"\n\n";


}

);



let choose = prompt(

text+

"输入编号读取"

);



if(!choose){

return;

}



let index =

Number(choose)-1;



if(saveList[index]){


loadSave(

saveList[index].id

);


}



}






// ======================
// 读取存档
// ======================


function loadSave(id){



let data =

localStorage.getItem(

"firefly_save_"+id

);



if(!data){


alert(

"这个存档没有聊天记录"

);


return;


}



chat.innerHTML=data;



localStorage.setItem(

"current_save",

id

);



window.scrollTo(

0,

document.body.scrollHeight

);



alert(

"读取存档成功"

);



}






// ======================
// 删除存档
// ======================


function deleteSave(){



let saveList =

JSON.parse(

localStorage.getItem("firefly_saves")

)||[];



if(saveList.length===0){


alert(

"没有存档"

);


return;


}



let text=

"请输入删除编号：\n\n";



saveList.forEach(

(save,index)=>{


text +=

(index+1)

+". "

+save.name

+"\n";


}

);



let choose=

prompt(text);



if(!choose){

return;

}



let index=

Number(choose)-1;



if(saveList[index]){


let id=

saveList[index].id;



// 删除聊天

localStorage.removeItem(

"firefly_save_"+id

);



// 删除列表

saveList.splice(

index,

1

);



localStorage.setItem(

"firefly_saves",

JSON.stringify(saveList)

);



// 如果删除的是当前存档

if(

localStorage.getItem("current_save")

==id

){


localStorage.removeItem(

"current_save"

);


}



alert(

"删除成功"

);



}



}
// =================================
// 🌸 流萤 · 新建聊天功能
// 清除当前聊天记录，重新开始
// =================================


function newChat(){


    let result = confirm(
        "确定要开始新的聊天吗？\n当前聊天记录会被清除。"
    );


    if(!result){

        return;

    }



    // 清除保存的聊天记录

    localStorage.removeItem(
        "firefly_chat"
    );



    // 清空聊天窗口

    chat.innerHTML = "";



    // 新的开场白

    chat.innerHTML += `

    <p class="ai">

    流萤：你好……新的旅程开始了。

    </p>

    `;



    // 保存新的状态

    localStorage.setItem(
        "firefly_chat",
        chat.innerHTML
    );



    // 自动滚动到底部

    window.scrollTo(
        0,
        document.body.scrollHeight
    );


}
</script>



</body>


</html>
