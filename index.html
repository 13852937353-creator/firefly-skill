<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>流萤</title>


<style>

body{

background:#0b1020;
color:white;
font-family:sans-serif;
text-align:center;

}


.box{

margin-top:60px;

}


.avatar{

width:150px;
height:150px;
border-radius:50%;
background:#8ee7ff;
margin:auto;

}



h1{

font-size:40px;

}



.chat{

margin:40px auto;

width:70%;
min-height:300px;

background:#1b2340;

padding:30px;

border-radius:25px;

text-align:left;

font-size:20px;

line-height:1.8;

}



.user{

color:#8ee7ff;

}



.ai{

color:#ffb6d9;

}



.input-area{

display:flex;

justify-content:center;

gap:10px;

}



input{

width:60%;

padding:15px;

border-radius:20px;

border:none;

font-size:16px;

}



button{

padding:15px 25px;

border-radius:20px;

border:none;

background:#8ee7ff;

color:#333;

font-size:16px;

}


</style>

</head>


<body>


<div class="box">


<div class="avatar"></div>


<h1>
🌸 流萤
</h1>



<div class="chat" id="chat">


<p class="ai">
流萤：欢迎回来，落尘。
</p>


<p>
这里以后会成为我们的聊天空间。
</p>


</div>



<div class="input-area">


<input 
id="input"
placeholder="和流萤说些什么..."
>


<button onclick="send()">
发送
</button>


</div>



</div>



<script>


//读取历史聊天

window.onload=function(){

let old=localStorage.getItem("firefly_chat");

if(old){

document.getElementById("chat").innerHTML=old;

}

}




async function send(){


let input=document.getElementById("input");


let msg=input.value;


if(!msg)return;



let chat=document.getElementById("chat");



//显示自己的话

chat.innerHTML+=`

<p class="user">

落尘：${msg}

</p>

`;



//请求AI

let res=await fetch("/api/chat",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:msg

})

});



let data=await res.json();



//显示流萤回复

chat.innerHTML+=`

<p class="ai">

流萤：${data.reply}

</p>

`;



//保存记忆

localStorage.setItem(
"firefly_chat",
chat.innerHTML
);



input.value="";



//自动滚动

window.scrollTo(
0,
document.body.scrollHeight
);


}


<script>
  // ==============================
// 用户名字系统
// 第一次进入网页询问名字
// 后续自动记住
// ==============================

let userName = localStorage.getItem("firefly_user_name");


if(!userName){

    userName = prompt(
        "你好，我是流萤。\n\n可以告诉我你的名字吗？"
    );


    if(!userName || userName.trim()===""){

        userName = "朋友";

    }


    localStorage.setItem(
        "firefly_user_name",
        userName
    );

}


// ==============================
// 发送消息时附带名字
// ==============================

// 找到你的 fetch 部分
// 原本应该类似：
//
// body:{
//     message:input.value
// }
//
// 改成：

body:{
    message:input.value,
    name:userName
}


</body>


</html>
