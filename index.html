<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>流萤</title>


<style>


*{

box-sizing:border-box;

}



body{

margin:0;

min-height:100vh;

background:

radial-gradient(
circle at top,
#35507a,
#11182d 45%,
#060812
);


color:white;

font-family:

"Microsoft YaHei",
sans-serif;

text-align:center;

overflow-x:hidden;


}



/* 星空光点 */

body::before{

content:"";

position:fixed;

width:100%;

height:100%;

background-image:

radial-gradient(
white 1px,
transparent 1px
);

background-size:

80px 80px;

opacity:.15;

pointer-events:none;

}



/* 主容器 */

.box{

padding-top:50px;

width:100%;

}



/* 流萤头像 */


.avatar{

width:160px;

height:160px;

margin:auto;

border-radius:50%;

overflow:hidden;

background:#8ee7ff;

box-shadow:

0 0 20px #8ee7ff,
0 0 50px #6fcfff;


animation:

float 4s infinite;


}


.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



@keyframes float{


0%{

transform:translateY(0);

}


50%{

transform:translateY(-12px);

}


100%{

transform:translateY(0);

}


}





h1{

font-size:42px;

margin-bottom:10px;

text-shadow:

0 0 20px #8ee7ff;


}



.subtitle{

color:#cceaff;

font-size:16px;

margin-bottom:30px;


}





/* 聊天区域 */


.chat{

width:75%;

max-width:900px;

min-height:350px;

margin:30px auto;


padding:25px;


background:

rgba(255,255,255,.08);


backdrop-filter:

blur(15px);



border-radius:25px;


border:

1px solid rgba(255,255,255,.15);



box-shadow:

0 0 40px rgba(120,220,255,.15);



text-align:left;


font-size:18px;

line-height:1.8;


overflow-y:auto;


}





/* 流萤消息 */


.ai{


color:#ffd8eb;


background:

rgba(255,180,220,.12);


padding:

12px 18px;


border-radius:

20px;


display:

inline-block;


max-width:80%;


margin:10px;


clear:both;


}




/* 用户消息 */


.user{


color:#c9f3ff;


background:

rgba(120,220,255,.12);


padding:

12px 18px;


border-radius:

20px;


display:block;


max-width:80%;


margin:10px;


margin-left:auto;


text-align:right;


}




/* 输入区域 */


.input-area{


display:flex;


justify-content:center;


gap:10px;


}




input{


width:55%;


padding:

15px 20px;


border-radius:

30px;


border:none;


outline:none;


background:

rgba(255,255,255,.12);



color:white;


font-size:16px;


}




input::placeholder{


color:#c7d8e8;


}





button{


padding:

14px 25px;


border-radius:

30px;


border:none;


cursor:pointer;



background:

linear-gradient(
45deg,
#8ee7ff,
#ffc6e5
);



color:#263044;


font-size:16px;



transition:.3s;


}




button:hover{


transform:

translateY(-3px);


box-shadow:

0 0 20px #8ee7ff;


}



/* 输入中 */


.typing{


color:#ffd8eb;

opacity:.8;


animation:

blink 1s infinite;


}



@keyframes blink{


50%{

opacity:.3;

}


}



</style>


</head>


<body>


<div class="box">


<div class="avatar">

<img src="firefly.png">

</div>



<h1>
🌸 流萤
</h1>


<div class="subtitle">

「Firely」

</div>



<div class="chat" id="chat">


<p class="ai">

流萤：欢迎回来

</p>


</div>



<div class="input-area">


<input

id="input"

placeholder="和流萤说些什么..."

>



<button onclick="send()">

发送

</button>



<button onclick="newChat()">

新建聊天

</button>


</div>


</div>
<script>

// 用户名字
let userName = localStorage.getItem("userName");

if(!userName){

userName = prompt("请输入你的名字") || "落尘";

localStorage.setItem(
"userName",
userName
);

}
localStorage.setItem(
"userName",
userName
);


//读取历史聊天

window.onload=function(){

let old=localStorage.getItem("firefly_chat");

if(old){

document.getElementById("chat").innerHTML=old;

}else{

document.getElementById("chat").innerHTML=
`
<p class="ai">
流萤：欢迎回来，${userName}。
</p>
`;

}

}




async function send(){


let input=document.getElementById("input");

let msg=input.value;


if(!msg)return;


let chat=document.getElementById("chat");



chat.innerHTML+=`

<p class="user">

${userName}：${msg}

</p>

`;



let res=await fetch("/api/chat",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({
message:msg,
userName:userName
})

});



let data=await res.json();
  if(data.userName){

    userName=data.userName;

    localStorage.setItem(
        "userName",
        userName
    );

}



chat.innerHTML+=`

<p class="ai">

流萤：${data.reply}

</p>

`;



localStorage.setItem(
"firefly_chat",
chat.innerHTML
);



input.value="";



window.scrollTo(
0,
document.body.scrollHeight
);


}




function newChat(){


let result=confirm(
"确定要开始新的聊天吗？\n当前聊天记录会被清除。"
);


if(!result){

return;

}



localStorage.removeItem(
"firefly_chat"
);



let chat=document.getElementById("chat");


chat.innerHTML=

`

<p class="ai">

流萤：你好……新的旅程开始了，${userName}。

</p>

`;



localStorage.setItem(
"firefly_chat",
chat.innerHTML
);



window.scrollTo(
0,
document.body.scrollHeight
);


}


</script>


  
</body>


</html>
