<body>

<div class="box">

<div class="avatar"></div>

<h1>🌸 流萤</h1>


<div class="chat" id="chat">

<p style="color:#ffb6d9">
流萤：欢迎回来，落尘。
</p>

<p>
这里以后会成为我们的聊天空间。
</p>


</div>


<br>


<input id="input" placeholder="和流萤说些什么...">

<button onclick="send()">发送</button>


</div>
<script>

async function send(){

let input=document.getElementById("input");

let msg=input.value;

if(!msg)return;


let chat=document.getElementById("chat");


chat.innerHTML += 
"<p style='color:#8ee7ff'>落尘："+msg+"</p>";


let res=await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:msg
})
});


let data=await res.json();


chat.innerHTML +=
"<p style='color:#ffb6d9'>流萤："+data.reply+"</p>";


input.value="";

}

</script>
