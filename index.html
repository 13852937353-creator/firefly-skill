<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>流萤</title>


<style>

body {
    background:#0b1020;
    color:white;
    font-family:sans-serif;
    text-align:center;
}


.box {
    margin-top:50px;
    padding:20px;
}


.avatar {

    width:120px;
    height:120px;

    border-radius:50%;

    background:#8ee7ff;

    margin:auto;

}


h1 {

    font-size:40px;

}


.chat {

    margin:30px auto;

    width:70%;

    min-height:250px;

    background:#1b2340;

    padding:25px;

    border-radius:20px;

    text-align:left;

    font-size:20px;

}


.user {

    color:#8ee7ff;

}


.ai {

    color:#ffb6d9;

}



.input-area {

    display:flex;

    justify-content:center;

    gap:10px;

}



input {

    width:60%;

    padding:15px;

    border-radius:20px;

    border:none;

    font-size:16px;

}



button {

    padding:15px 25px;

    border-radius:20px;

    border:none;

    background:#8ee7ff;

    color:#0b1020;

    font-size:16px;

}


</style>


</head>



<body>


<div class="box">


<div class="avatar"></div>


<h1>
🌸 流萤
</h1>



<div class="chat" id="chat">


<p class="ai">
流萤：欢迎回来，落尘。
</p>


<p>
这里以后会成为我们的聊天空间。
</p>


</div>




<div class="input-area">


<input 
id="input"
placeholder="和流萤说些什么..."
>


<button onclick="send()">
发送
</button>


</div>



</div>




<script>


async function send(){


let input=document.getElementById("input");


let msg=input.value;


if(!msg)return;



let chat=document.getElementById("chat");



chat.innerHTML +=

"<p class='user'>落尘："+msg+"</p>";



let res=await fetch("/api/chat",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


message:msg


})


});



let data=await res.json();



chat.innerHTML +=

"<p class='ai'>流萤："+data.reply+"</p>";



input.value="";


}



</script>



</body>


</html>
